  <!-- ===== B · BONE TREE ===== -->
  <text x="510" y="146" font-size="14" letter-spacing="3" fill="#6E93A8"><tspan fill="#F0A23C">B.</tspan>  CÂY XƯƠNG ĐÍCH · ~20 KHỚP</text>
  <g font-size="17" fill="#BDB39A">
    <text x="510" y="186"><tspan fill="#E8E2D4">Hips</tspan></text>
    <text x="510" y="216">├─ <tspan fill="#E8E2D4">Spine ─ Chest</tspan></text>
    <text x="510" y="246">│   ├─ <tspan fill="#F0A23C">[Neck]</tspan> ─ <tspan fill="#E8E2D4">Head</tspan></text>
    <text x="510" y="276">│   ├─ ClavicleL ─ UpperArmL ─ ForearmL ─ <tspan fill="#6E93A8">HandL</tspan></text>
    <text x="510" y="306">│   └─ ClavicleR ─ UpperArmR ─ ForearmR ─ <tspan fill="#F0A23C">HandR ◄ đèn</tspan></text>
    <text x="510" y="336">├─ ThighL ─ ShinL ─ FootL ─ <tspan fill="#F0A23C">[ToeL]</tspan></text>
    <text x="510" y="366">└─ ThighR ─ ShinR ─ FootR ─ <tspan fill="#F0A23C">[ToeR]</tspan></text>
  </g>
  <line x1="510" y1="392" x2="1200" y2="392" stroke="#2C3545"/>
  <g font-size="13.5" fill="#9AA3B0">
    <text x="510" y="424"><tspan fill="#F0A23C">ĐẠO CỤ:</tspan> sào đèn gắn bằng BoneAttachment3D → HandR;</text>
    <text x="510" y="446">tay phải nắm sào ghì vai — hết “đèn lơ lửng cạnh vai”.</text>
    <text x="510" y="476">Rig hiện tại 18 xương: thiếu Neck + Toe, đặt khớp áng chừng.</text>
    <text x="510" y="498">Khác biệt cốt lõi: <tspan fill="#E8E2D4">tọa độ khớp neo theo mốc cột A</tspan>.</text>
  </g>

  <!-- ===== C · DEFECTS ===== -->
  <text x="510" y="548" font-size="14" letter-spacing="3" fill="#6E93A8"><tspan fill="#F0A23C">C.</tspan>  LỖI HIỆN TẠI → SỬA</text>
  <g font-size="15">
    <text x="510" y="584" fill="#D9694B" font-family="Segoe UI,sans-serif" font-weight="700">● Tay cầm đèn kỳ lạ</text>
    <text x="528" y="606" fill="#E8E2D4">→ BoneAttachment3D vào HandR; tay phải ghì sào.</text>
    <text x="510" y="640" fill="#D9694B" font-family="Segoe UI,sans-serif" font-weight="700">● Khớp sai vị trí</text>
    <text x="528" y="662" fill="#E8E2D4">→ khuỷu@rốn 62% · cổ tay@háng 48% · vai@82%.</text>
    <text x="510" y="696" fill="#D9694B" font-family="Segoe UI,sans-serif" font-weight="700">● Dáng đi cứng</text>
    <text x="528" y="718" fill="#E8E2D4">→ trọng số giải phẫu + lắc hông, đảo bàn chân, vung tay.</text>
    <text x="510" y="752" fill="#D9694B" font-family="Segoe UI,sans-serif" font-weight="700">● Màu nhợt (76k đỉnh, không UV)</text>
    <text x="528" y="774" fill="#E8E2D4">→ material da+áo chàm; hoặc sinh UV (xatlas) + bake texture.</text>
  </g>

